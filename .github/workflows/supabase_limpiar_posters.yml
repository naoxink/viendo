name: Limpiar pósters huérfanos

on:
  schedule:
    # Todos los días a las 05:00 UTC (después de completar metadatos a las 04:00)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo mostrar lo que se borraría"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  limpiar-posters:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install supabase

    - name: Borrar pósters huérfanos
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
          python scripts/supabase_limpiar_posters.py --dry-run
        else
          python scripts/supabase_limpiar_posters.py
        fi

    - name: Guardar los borrados en el repositorio
      if: ${{ github.event.inputs.dry_run != 'true' }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        # "git add" sobre la carpeta también registra los ficheros eliminados
        git add posters/

        git commit -m "🤖 Limpieza: pósters de series que ya no se siguen" || echo "No hay pósters huérfanos que borrar."
        git push