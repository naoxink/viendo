name: Trending semanal

on:
  schedule:
    - cron: '0 6 * * 1' # Lunes 06:00 UTC semanal
  workflow_dispatch: # Te permite ejecutarlo a mano desde la web de GitHub cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run trending script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 scripts/supabase_trending_the_tvdb.py --thetvdb-api-key "${{ secrets.THETVDB_API_KEY }}" --limit 20
