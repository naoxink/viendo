name: Completar Metadatos y Pósters de Series

on:
  schedule:
    # Se ejecuta todos los días a las 04:00 UTC (o ajusta la frecuencia que prefieras)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permite lanzarlo manualmente desde la pestaña Actions en GitHub

permissions:
  contents: write # Necesario para hacer commit y push si descarga nuevos pósters locales

jobs:
  completar-metadatos:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests supabase

    - name: Ejecutar script de metadatos
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python scripts/supabase_completar_metadatos.py --apikey "${{ secrets.TVDB_API_KEY }}"

    - name: Guardar y subir nuevos pósters locales al repositorio (si los hay)
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Añadimos la carpeta de pósters por si el script descargó alguno nuevo
        git add posters/
        
        # El "|| echo" evita que falle si no hay cambios en los pósters hoy
        git commit -m "🤖 Actualización automática: nuevos pósters de TheTVDB" || echo "No hay nuevos pósters que guardar hoy."
        git push