name: Sincronización Diaria de Series

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch: # Esto te permite activar el script a mano desde la web de GitHub cuando quieras

permissions:
  contents: write # Da permiso a la Action para modificar y subir archivos al repositorio

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias necesarias
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Ejecutar script de actualización
      env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python scripts/actualizar_fechas.py --apikey "${{ secrets.TVDB_API_KEY }}"

    - name: Guardar cambios en el repositorio
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add posters data/status.json data/viendo.json data/en_cola.json data/dropeadas.json data/completadas.json
        
        # El "|| echo" evita que el workflow falle si un día no hay ningún cambio en los archivos
        git commit -m "🤖 Sincronización automática de series (TheTVDB)" || echo "No hay cambios que actualizar hoy."
        git push