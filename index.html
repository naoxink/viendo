<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series Tracker</title>
    <link rel="stylesheet" href="style.css">

    <!--
        Import map: permite escribir `import { ref } from 'vue'` en los módulos
        sin necesidad de un bundler (Vite/Webpack). El navegador resuelve 'vue'
        directamente contra el build ESM de Vue alojado en jsDelivr.
        Si en algún momento quieres blindarte de cambios en la CDN, sustituye
        "vue@3" por una versión fija, p.ej. "vue@3.5.13".
    -->
    <script type="importmap">
    {
        "imports": {
            "vue": "https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.prod.js"
        }
    }
    </script>
</head>
<body>
    <div id="app"></div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
