<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div id="stats" class="stats-bar"></div>
        <h1>📺 Viendo actualmente</h1>
        <div id="series-list" class="grid"></div>

        <div class="last-update progress"><small>Actualizado el </small><small class="date"></small></div>

        <div id="en-cola-container"></div>

        <div class="search-wrapper">
            <input type="search" id="history-search" placeholder="Buscar en el histórico...">
        </div>

        <h1 class="history-title">✅ Completadas</h1>
        <div id="history-list" class="grid history"></div>

        <div id="dropped-container" class="dropped-section-wrapper"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
